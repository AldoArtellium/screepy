steamKey: <your steam key> # https://steamcommunity.com/dev/apikey
pinnedPackages:
  ssri: 8.0.1
  cacache: 15.3.0
  passport-steam: 1.0.17
  minipass-fetch: 2.1.2
  express-rate-limit: 6.7.0
  # 2.9+ crashes at load with screepsmod-mongo (config.mongo.client undefined)
  screepsmod-auth: 2.8.3
version: latest
# Few active rooms: fewer processors = less redis coordination per tick (faster local tests)
processors: 2
runnerThreads: 2
mods:
- screepsmod-mongo
- screepsmod-auth
- screepsmod-admin-utils
bots:
  simplebot: "screepsbot-zeswarm"
extraPackages:
  morgan: "*"
  # Pin (see pinnedPackages): 2.9+ crashes at load
  screepsmod-auth: "2.8.3"
localMods: ./mods
backup:
  dirs:
  - tests
serverConfig:
  welcomeText:  |
    <style>.header h1{  text-align: center; }</style>
    <div class="header">
    <h1>Test Server</h1>
    Welcome to the Screeps test server.<br>
    Mods include screepsmod-auth and several custom mods to enable email notifications, control tickrate, power banks, portals, and other internal improvements.<br><br>
    <div style="text-align: center">
    This server is for testing purposes only. <br>
    </div>  
  tickRate: 200
  socketUpdateRate: 200
  maxCPU: 20
  baseCPU: 20
  stepCPU: 10
  shardName: 'test1'
  